<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DeadLight</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="lit-stage" hidden></canvas>
    <div id="flash" aria-hidden="true"></div>

    <div id="overlay">
      <section class="screen" id="panel-menu">
        <header class="title">
          <h1>DEADLIGHT</h1>
        </header>

        <label class="field">
          <span>Player name</span>
          <input id="name" maxlength="12" autocomplete="off" spellcheck="false" />
        </label>

        <div class="actions">
          <button id="btn-public" class="key">Find match</button>
          <button id="btn-create" class="key">Create party</button>
        </div>

        <form class="field inline" id="form-code">
          <span>Party code</span>
          <input id="code" maxlength="4" placeholder="----" autocomplete="off" spellcheck="false" />
          <button type="submit" class="key">Join</button>
        </form>

        <p class="error" id="menu-error"></p>
      </section>

      <section class="screen" id="panel-lobby" hidden>
        <header class="title">
          <h2 id="lobby-title">Party</h2>
          <p class="sub" id="lobby-sub">Waiting for fighters</p>
        </header>

        <div class="readout" id="lobby-code-row" hidden>
          <span>Party code</span>
          <button class="code" id="lobby-code"></button>
        </div>

        <div class="readout">
          <span>Fighters</span>
          <b id="lobby-count">0/6</b>
        </div>
        <ul id="lobby-players"></ul>

        <div class="readout">
          <span>Fighter</span>
        </div>
        <div class="roster" id="lobby-colors"></div>

        <div class="readout">
          <span>Mode</span>
          <b id="mode-name"></b>
        </div>
        <div class="mode-picks" id="lobby-modes"></div>
        <p class="sub" id="mode-blurb"></p>

        <div class="readout">
          <span>Arena</span>
          <b id="map-name"></b>
        </div>
        <div class="map-picks" id="lobby-maps"></div>
        <p class="sub" id="map-blurb"></p>

        <div class="bots" id="lobby-bots" hidden>
          <button id="btn-bot" class="key">+ Bot</button>
          <button id="btn-bot-level" class="key quiet">Level: normal</button>
        </div>

        <div class="readout">
          <span>Finisher</span>
          <b id="finisher-name"></b>
        </div>
        <div class="finishers">
          <canvas id="finisher-preview" aria-hidden="true"></canvas>
          <div class="finisher-picks" id="lobby-finishers"></div>
        </div>

        <p class="sub" id="touch-hint" hidden>Left thumb moves &middot; right thumb aims</p>

        <div class="actions">
          <button id="btn-ready" class="key">Ready</button>
          <button id="btn-start" class="key" hidden>Start match</button>
          <button id="btn-music" class="key quiet">Music on &middot; M</button>
          <button id="btn-leave" class="key quiet">Leave</button>
        </div>
      </section>

      <section class="screen" id="panel-result" hidden>
        <h2 id="result-title">Eliminated</h2>
        <canvas id="result-sprite" width="56" height="80"></canvas>
        <p class="sub" id="result-detail"></p>
        <p class="stats" id="result-stats"></p>
        <ol id="result-standings"></ol>
        <div class="actions">
          <button id="btn-again" class="key">Rematch</button>
        </div>
      </section>
    </div>

    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
